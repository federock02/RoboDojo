# Same kinematic setup and action dimensions as dual_x5.  The single extra
# field is read only by the opt-in RobotManager hook installed for this task.
robots:
  - {
    robot_type: arm,
    robot_name: x5,
    coupled: false,
    default_root_pos: [-0.3, -0.45, 0.765],
    default_root_rot: [0.707, 0, 0, 0.707],
    grasp_perfect_direction: "top_down_little_right",
    arm_effort_limit_sim: 30.0
  }
  - {
    robot_type: arm,
